<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รักที่สุดเลย ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:black;
    cursor:pointer;
    position:relative;
    font-family:sans-serif;
}

.text{
    position:absolute;
    font-size:32px;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp 2.5s forwards;
    transform:translate(-50%,-50%);
    text-shadow:0 0 15px currentColor;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
    to{
        opacity:0;
        transform:translate(-50%,-150%) scale(1.5);
    }
}

.heart{
    position:absolute;
    top:-50px;
    font-size:30px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

#centerMessage{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:50px;
    font-weight:bold;
    display:none;
    text-shadow:0 0 20px hotpink;
}
</style>
</head>
<body>

<div id="centerMessage">รักเธอที่สุดเลยตัวเล็ก ❤️</div>

<script>
const messages = [
    "อยากจุ๊บจัง ❤️",
    "คิดถึงที่สุดเลย 🥰",
    "รักเธอมากๆเลยนะ 💖",
    "เธอน่ารักที่สุด 💕",
    "อยู่ด้วยกันไปนานๆ 💞",
];

const colors = [
    "#ff4d6d",
    "#ff66c4",
    "#ff99ff",
    "#ffcc00",
    "#66ffcc",
    "#66ccff",
    "#ffffff"
];

let clicks = 0;
const targetClicks = 10;
let finished = false;

document.addEventListener("click", function(e){

    if(finished) return;

    clicks++;

    const text = document.createElement("div");
    text.className = "text";
    text.innerText =
        messages[Math.floor(Math.random()*messages.length)];

    text.style.color =
        colors[Math.floor(Math.random()*colors.length)];

    text.style.left = e.clientX + "px";
    text.style.top = e.clientY + "px";

    document.body.appendChild(text);

    setTimeout(()=>{
        text.remove();
    },2500);

    if(clicks >= targetClicks){
        finished = true;

        document.getElementById("centerMessage").style.display = "block";

        for(let i=0;i<200;i++){

            setTimeout(()=>{
                const heart = document.createElement("div");

                heart.className = "heart";
                heart.innerHTML = "❤️";

                heart.style.left =
                    Math.random()*window.innerWidth + "px";

                heart.style.fontSize =
                    (20 + Math.random()*40) + "px";

                heart.style.animationDuration =
                    (3 + Math.random()*4) + "s";

                document.body.appendChild(heart);

                setTimeout(()=>{
                    heart.remove();
                },7000);

            }, i*50);
        }
    }
});
</script>

</body>
</html>
